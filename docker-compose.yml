services:
  backend:
    container_name: corevision-backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - TRITON_HOST=triton
      - TRITON_GRPC_PORT=8001
    networks:
      - corevision-network
  
  triton:
    container_name: corevision-triton
    image: nvcr.io/nvidia/tritonserver:25.12-py3
    command: tritonserver --model-repository=/models --log-verbose=1
    ports:
      - "8001:8001"  # gRPC
      - "8002:8000"  # HTTP (avoiding conflict with backend:8000)
    volumes:
      - ./infra/triton/model_repo:/models
    networks:
      - corevision-network
    restart: unless-stopped
  
  postgres:
    container_name: corevision-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=corevision
      - POSTGRES_PASSWORD=corevision123
      - POSTGRES_DB=corevision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corevision-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corevision"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
networks:
  corevision-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local